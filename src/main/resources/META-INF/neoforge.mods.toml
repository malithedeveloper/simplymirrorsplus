modLoader = "javafml"
loaderVersion = "${fmlRange}"
license = "MIT"
issueTrackerURL = "https://github.com/malithedeveloper/simplymirrorsplus/issues"
[[mods]]
modId = "simplymirrorsplus"
version = "${version}"
displayName = "Simply Mirrors Plus"
${logoKey} = "assets/simplymirrorsplus/icon.png"
authors = "NsTut, malidev"
description = "Craftable full-block frameless mirrors with live reflections on all six faces, mirror-in-mirror rendering, per-mirror modes and in-game settings. Based on Simply Mirrors by NsTut, maintained by malidev."
[[dependencies.simplymirrorsplus]]
modId = "neoforge"
type = "required"
versionRange = "[${loaderVersion},)"
ordering = "NONE"
side = "BOTH"
[[dependencies.simplymirrorsplus]]
modId = "minecraft"
type = "required"
versionRange = "${mavenRange}"
ordering = "NONE"
side = "BOTH"

[[mixins]]
config = "simplymirrorsplus.mixins.json"
