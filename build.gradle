plugins {
    id 'dev.architectury.loom' version '1.11-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id 'base'
}
architectury { minecraft = '1.21.4' }
allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
    repositories { mavenCentral() }
}
subprojects { p ->
    if (p.name == 'common') return
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    base { archivesName = "${rootProject.archives_name}-${p.name}" }
    architectury {
        platformSetupLoomIde()
        fabric()
    }
    loom {
        silentMojangMappingsLicense()
        mixin { defaultRefmapName = 'simplymirrorsplus.refmap.json' }
    }
    dependencies {
        minecraft 'net.minecraft:minecraft:1.21.4'
        mappings loom.officialMojangMappings()
        // The Iris RETURN injection uses MixinExtras @Local.
        compileOnly 'io.github.llamalad7:mixinextras-common:0.4.1'
        modImplementation 'net.fabricmc:fabric-loader:0.17.2'
    }
    java {
        toolchain.languageVersion = JavaLanguageVersion.of(21)
        withSourcesJar()
    }
    sourceSets.main.java.srcDir rootProject.file('common/src/main/java')
    sourceSets.main.java.srcDir rootProject.file('common-client/src/main/java')
    sourceSets.main.java.srcDir rootProject.file('common-1.21.4/src/main/java')
    sourceSets.main.resources.srcDir rootProject.file('common-1.21.4/src/main/resources')
    sourceSets.main.resources.srcDir rootProject.file('common-assets/src/main/resources')
    tasks.withType(JavaExec).configureEach {
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    }
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 21
    }
    processResources {
        inputs.property 'version', project.version
        filesMatching('fabric.mod.json') { expand version: project.version }
    }
    tasks.withType(Jar).configureEach { from(rootProject.file('LICENSE')); from(rootProject.file('NOTICE')) }
    apply from: rootProject.file('tools/visual.gradle')
    apply from: rootProject.file('tools/shader-runtime.gradle')
}

tasks.named('build') { dependsOn subprojects.collect { it.tasks.named('build') } }
