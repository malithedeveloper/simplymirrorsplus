if (!providers.gradleProperty('visualTest').isPresent()) return

def mc = providers.gradleProperty('visualMc').get()
def loader = providers.gradleProperty('visualLoader').get()
def port = providers.gradleProperty('visualPort').get()
def runName = providers.gradleProperty('visualRunName').orElse('visual').get()
if (!(runName ==~ /[a-z0-9-]+/)) throw new GradleException('Invalid visual run name')
logger.lifecycle("Visual target: ${mc}/${loader}")
layout.buildDirectory = file('build/visual')
if (!(mc == '1.16.5' && loader == 'forge')) {
sourceSets.main.java.srcDir(rootProject.file(rootProject == project ? '../visual-tests/common/java' : 'visual-tests/common/java'))
sourceSets.main.java.srcDir(rootProject.file(rootProject == project ? "../visual-tests/${mc}/java" : "visual-tests/${mc}/java"))
}
sourceSets.main.resources.srcDir(rootProject.file(rootProject == project ? '../visual-tests/resources' : 'visual-tests/resources'))
processResources {
    inputs.property 'visualTest', true
    doLast {
        def fabric = new File(destinationDir, 'fabric.mod.json')
        if (fabric.exists()) {
            def json = new groovy.json.JsonSlurper().parse(fabric)
            json.mixins.add('simplymirrorsplus.visual.mixins.json')
            fabric.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json))
        }
        def neo = new File(destinationDir, 'META-INF/neoforge.mods.toml')
        if (neo.exists()) neo.append('\n[[mixins]]\nconfig = "simplymirrorsplus.visual.mixins.json"\n')

    }
}
if (mc == '1.16.5' && loader == 'forge') {
    minecraft.runs {
        visualClient {
            taskName 'runVisualClient'
            parent project.minecraft.runs.getByName('client')
            workingDirectory project.file("run/${runName}-client")
            property 'simplymirrorsplus.visualPort', port
            jvmArgs '-Xmx1024m'
            args '--width', '960', '--height', '540', '--mixin', 'simplymirrorsplus.visual.mixins.json'
            mods { simplymirrorsplus { source sourceSets.main } }
        }
        visualServer {
            taskName 'runVisualServer'
            parent project.minecraft.runs.getByName('server')
            workingDirectory project.file("run/${runName}-server")
            jvmArgs '-Xmx1024m'
            args '--nogui'
            mods { simplymirrorsplus { source sourceSets.main } }
        }
    }
} else if (plugins.hasPlugin('net.neoforged.moddev')) {
    neoForge.runs {
        visualClient {
            client()
            gameDirectory = project.file("run/${runName}-client")
            systemProperty 'simplymirrorsplus.visualTest', 'true'
            systemProperty 'simplymirrorsplus.visualPort', port
            jvmArguments.addAll '-Xmx1024m'
            programArguments.addAll '--width', '960', '--height', '540'
        }
        visualServer {
            server()
            gameDirectory = project.file("run/${runName}-server")
            jvmArguments.addAll '-Xmx1024m'
            programArgument '--nogui'
        }
    }
} else {
    loom.runs {
        visualClient {
            client()
            runDir("run/${runName}-client")
            property 'simplymirrorsplus.visualTest', 'true'
            property 'simplymirrorsplus.visualPort', port
            vmArg '-Xmx2048m'
            programArgs '--width', '960', '--height', '540'
        }
        visualServer {
            server()
            runDir("run/${runName}-server")
            vmArg '-Xmx1024m'
            programArg 'nogui'
        }
    }
    if (loader == 'forge') loom.forge.mixinConfig('simplymirrorsplus.visual.mixins.json')
}
