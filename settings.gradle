pluginManagement {
    repositories {
        maven { url 'https://maven.fabricmc.net/' }
        maven { url 'https://maven.architectury.dev/' }
        maven { url 'https://maven.minecraftforge.net/' }
        maven { url 'https://maven.neoforged.net/releases/' }
        gradlePluginPortal()
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}
rootProject.name = 'simplymirrorsplus'
include 'common'
def targets = ['fabric-1.16.5', 'fabric-1.20.1', 'forge-1.20.1', 'fabric-1.21.1', 'neoforge-1.21.1', 'fabric-1.21.4', 'neoforge-1.21.4',
    'fabric-1.21.5', 'neoforge-1.21.5', 'fabric-1.21.8', 'neoforge-1.21.8']
def selected = providers.gradleProperty('target').orNull
if (selected != null && selected != 'common' && !targets.contains(selected)) {
    throw new GradleException("Unknown legacy target: ${selected}. Use tools/build.py for the complete target matrix.")
}
(selected == null ? targets : targets.findAll { it == selected }).each { include it }
// Minecraft 1.21.11 and 26.x use Gradle 9 and independent settings in their own target directories.
